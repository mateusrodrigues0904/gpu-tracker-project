<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-fundo: #1d2021;
        --color-fundo-secundario: #292d2f;
        --color-card: #282828;
        --color-card-borda: #242424;
        --color-destaque-primario: #fabd2f;
        --color-destaque-secundario: #83a598;
        --color-preco-baixo: #b8bb26;
        --color-preco-alto: #fb4934;
        --color-texto-principal: #ebdbb2;
        --color-texto-secundario: #a89984;
      }
    </style>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");
    </style>
    <title>Price Traker</title>
  </head>
  <body class="bg-fundo">
    <header class="w-screen h-15 flex justify-between">
      <div class="container_esquerda flex items-center h-15">
        <img class="icone_gpu h-8 pl-5" src="icons/gpu.svg" alt="Icone GPU" />
        <p class="text-destaque-primario pl-3 font-bold">GPU TRACKER</p>
        <div class="h-15 flex space-x-8 text-texto-secundario ml-30">
          <div
            class="flex items-center hover:border-b-2 hover:border-destaque-primario cursor-pointer"
          >
            <img
              class="icone_home h-5 pr-2"
              src="icons/house.svg"
              alt="Icone Home"
            />
            <p>Dashboard</p>
          </div>
          <div
            class="flex items-center hover:border-b-2 hover:border-destaque-primario cursor-pointer"
          >
            <img
              class="icone_produtos h-5 pr-2"
              src="icons/shopping-basket.svg"
              alt="Icone Produtos"
            />
            <p>Produtos</p>
          </div>
          <div
            class="flex items-center hover:border-b-2 hover:border-destaque-primario cursor-pointer"
          >
            <img
              class="icone_sobre h-5 pr-2"
              src="icons/info.svg"
              alt="Icone Sobre"
            />
            <p>Sobre</p>
          </div>
        </div>
      </div>

      <div class="container_direita mr-5 flex items-center">
        <img
          class="w-10 h-10 p-2 icone_lua items-center bg-card border-card-borda rounded-lg cursor-pointer"
          src="icons/moon.svg"
          alt="Icone lua"
        />
      </div>
    </header>
    <section></section>
    <section></section>
    <footer></footer>
  </body>
</html>
